<article class="card">
  <div class="card__avatar">
    @if (logoUrl(); as src) {
      <img class="card__logo" [src]="src" [alt]="storeName()" />
    } @else {
      <div class="card__logo card__logo--placeholder"></div>
    }

    @if (isLinked()) {
      <span class="card__badge" aria-hidden="true">
        <svg class="card__badge-icon" viewBox="0 0 24 24">
          <path
            d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3"
          />
          <line x1="8" y1="12" x2="16" y2="12" />
        </svg>
      </span>
    }
  </div>

  <span class="card__name">{{ storeName() }}</span>
</article>
