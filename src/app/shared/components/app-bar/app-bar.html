<!--
  Tres columnas (1fr auto 1fr) en vez de space-between: así la marca queda
  centrada contra el ancho de la barra y no se corre cuando un lado tiene una
  acción más que el otro.
-->
<header class="app-bar">
  <div class="app-bar__side">
    @if (showBack()) {
      <button type="button" class="app-bar__action" aria-label="Volver" (click)="backClick.emit()">
        <svg class="app-bar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="20" y1="12" x2="5" y2="12" />
          <polyline points="12 5 5 12 12 19" />
        </svg>
      </button>
    }

    @if (showMenu()) {
      <button
        type="button"
        class="app-bar__action"
        aria-label="Abrir menú"
        (click)="menuClick.emit()"
      >
        <svg class="app-bar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="3" y1="7" x2="21" y2="7" />
          <line x1="3" y1="12" x2="14" y2="12" />
          <line x1="3" y1="17" x2="18" y2="17" />
        </svg>
      </button>
    }
  </div>

  <div class="app-bar__brand">
    @if (heading(); as text) {
      <h1 class="app-bar__heading">{{ text }}</h1>
    } @else if (logoUrl(); as src) {
      <img class="app-bar__logo" [src]="src" [alt]="brandName()" />
    } @else {
      <span class="app-bar__mark" [attr.aria-label]="brandName()" role="img">{{ initial() }}</span>
    }
  </div>

  <div class="app-bar__side app-bar__side--end">
    @if (showNotifications()) {
      <button
        type="button"
        class="app-bar__action"
        [attr.aria-label]="notificationsLabel()"
        (click)="notificationsClick.emit()"
      >
        <svg class="app-bar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.7 21a2 2 0 0 1-3.4 0" />
        </svg>

        @if (hasBadge()) {
          <span class="app-bar__badge" aria-hidden="true">{{ badgeLabel() }}</span>
        }
      </button>
    }

    @if (showSearch()) {
      <button
        type="button"
        class="app-bar__action"
        aria-label="Buscar"
        (click)="searchClick.emit()"
      >
        <svg class="app-bar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>
    }
  </div>
</header>
