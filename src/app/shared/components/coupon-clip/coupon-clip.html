<article class="coupon-clip" [class.coupon-clip--highlighted]="highlighted()">
  <div class="coupon-clip__thumb">
    @if (imageUrl(); as src) {
      <img class="coupon-clip__image" [src]="src" [alt]="productName()" />
    } @else {
      <div class="coupon-clip__image coupon-clip__image--placeholder"></div>
    }
  </div>

  <div class="coupon-clip__body">
    <p class="coupon-clip__value">
      <span class="coupon-clip__mark" aria-hidden="true">
        <svg class="coupon-clip__mark-icon" viewBox="0 0 24 24">
          <line x1="19" y1="5" x2="5" y2="19" />
          <circle cx="6.5" cy="6.5" r="2.5" />
          <circle cx="17.5" cy="17.5" r="2.5" />
        </svg>
      </span>
      {{ amount() }} <span class="coupon-clip__quantity">/ {{ quantity() }}</span>
    </p>

    @if (expiresOn()) {
      <p class="coupon-clip__expiry">Vence {{ expiresOn() }}</p>
    }

    <p class="coupon-clip__name">{{ productName() }}</p>
  </div>

  <!--
    role="switch" en vez de un checkbox estilado: el estado lo publica
    aria-checked, que además es de donde cuelga el CSS del encendido, así que no
    hay una clase que pueda quedar desincronizada del valor real.
  -->
  <button
    type="button"
    class="coupon-clip__switch"
    role="switch"
    [attr.aria-checked]="active()"
    [attr.aria-label]="'Activar cupón de ' + productName()"
    (click)="toggle()"
  >
    <span class="coupon-clip__switch-label">{{ active() ? 'ON' : 'OFF' }}</span>
    <span class="coupon-clip__switch-thumb"></span>
  </button>
</article>
