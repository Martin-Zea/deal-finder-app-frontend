<form class="search-bar" role="search" (submit)="onSubmit($event)">
  <!--
    La lupa es un botón de verdad y no un adorno. En el celular la vía principal
    sigue siendo la tecla «Buscar» del teclado, pero un form sin botón de submit
    depende del envío implícito, que solo funciona mientras haya un único campo:
    el día que aparezca un segundo filtro, la tecla dejaría de buscar.
  -->
  <button type="submit" class="search-bar__submit" aria-label="Buscar">
    <svg class="search-bar__icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
  </button>

  <!--
    enterkeyhint le dice al teclado del teléfono que su tecla de acción dice
    «Buscar»; sin eso iOS pone «Ir» y Android una flecha. autocapitalize y
    autocorrect apagados porque una marca no es una oración y no queremos que
    «dove» se convierta en otra palabra.
  -->
  <input
    #field
    class="search-bar__input"
    type="search"
    enterkeyhint="search"
    autocapitalize="off"
    autocorrect="off"
    spellcheck="false"
    [placeholder]="placeholder()"
    [value]="query()"
    (input)="onInput($event)"
    aria-label="Buscar oferta, marca o tienda"
  />

  <!--
    La ✕ es nuestra y no la nativa de type="search": Firefox no dibuja ninguna,
    iOS Safari tampoco, y la de Chrome mide unos 12px y no se puede agrandar ni
    pintar. Aparece solo cuando hay texto, porque un botón que no hace nada es
    ruido.
  -->
  @if (query()) {
    <button type="button" class="search-bar__clear" aria-label="Limpiar búsqueda" (click)="clear()">
      <svg class="search-bar__icon search-bar__icon--clear" viewBox="0 0 24 24" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </button>
  }
</form>
