@if (loading()) {
  <!--
    Misma estructura que la rama real —.coupon, __thumb, __body— para que el
    alto no salte cuando llegan los datos. Los altos de las líneas copian los
    del texto: 1.15rem el título, 0.95rem cada línea de la descripción.
  -->
  <div class="coupon coupon--loading" aria-busy="true">
    <div class="coupon__thumb">
      <app-skeleton width="100%" height="100%" radius="md" />
    </div>

    <div class="coupon__body">
      <app-skeleton width="45%" height="1.15rem" />
      <app-skeleton [lines]="2" height="0.95rem" />
    </div>
  </div>
} @else {
  <a class="coupon" [routerLink]="link()">
    <div class="coupon__thumb">
      @if (imageUrl(); as src) {
        <img class="coupon__image" [src]="src" [alt]="title()" />
      } @else {
        <div class="coupon__image coupon__image--placeholder"></div>
      }
    </div>

    <div class="coupon__body">
      <span class="coupon__title">{{ title() }}</span>
      <span class="coupon__description">{{ description() }}</span>
    </div>
  </a>
}
